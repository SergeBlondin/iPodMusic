name: iPodMusic
options:
  bundleIdPrefix: com.sergebl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Sources.xcconfig
  Release: Config/Sources.xcconfig
packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    from: 5.0.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: false
    INFOPLIST_FILE: iPodMusic/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.sergebl.iPodMusic
    DEVELOPMENT_TEAM: "X647WK46TN"
    CODE_SIGN_STYLE: Automatic
targets:
  iPodMusic:
    type: application
    platform: iOS
    sources:
      - path: iPodMusic
    dependencies:
      - package: SpotifyiOS
        product: SpotifyiOS
    settings:
      base:
        PRODUCT_NAME: iPodMusic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  iPodMusic:
    build:
      targets:
        iPodMusic: all
    run:
      config: Debug
